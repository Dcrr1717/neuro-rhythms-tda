name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint (pyflakes-level errors)
        run: pip install ruff && ruff check src tests --select F,E9
      - name: Unit + smoke tests (offline)
        run: pytest -q
      - name: Small default benchmark (offline, ~2 min)
        if: matrix.python-version == '3.12'
        run: python -m neurorhythms --config configs/small.yaml --no-cache
      - name: Small SW1PerS + Riemannian benchmark (offline, single + multi-channel, ~6 min)
        if: matrix.python-version == '3.12'
        run: python -m neurorhythms.sw1pers_bench --config configs/sw1pers_small.yaml --no-cache
      - name: Upload small-run reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: small-runs
          path: |
            results/small/
            results/sw1pers_small/

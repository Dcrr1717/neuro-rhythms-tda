[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neurorhythms"
version = "0.2.0"
description = "Healthy vs epileptic vs parkinsonian rhythms from neural-mass EEG: topology (sublevel-set, SW1PerS) vs band power, Riemannian covariance and a 1D-CNN, grouped CV."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Cesar Daniel Reinoso"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "gudhi>=3.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "ripser>=0.6",
    "pyriemann>=0.6",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
neurorhythms = "neurorhythms.pipeline:main"
neurorhythms-sw1pers = "neurorhythms.sw1pers_bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
